server {
    listen 80;
    root /usr/share/nginx/html;

    # The API, the same job proxy.conf.json does in development.
    # The trailing slash in proxy_pass strips the prefix: /api/chat -> http://backend:8000/chat
    location /api/ {
        proxy_pass http://backend:8000/;
        client_max_body_size 50m;  # nginx's default is 1 MB; the backend accepts PDFs up to 50 MB
        proxy_read_timeout 300s;   # local LLM answers and large uploads can take minutes (default 60 s)
        proxy_send_timeout 300s;
    }

    # The Angular app. Unknown paths get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
